name: Une idée
description: Proposer une fonctionnalité ou une amélioration, à discuter avant d'écrire du code.
labels: [idée]
body:
  - type: markdown
    attributes:
      value: Certaines idées ont déjà été essayées puis retirées, ouvre d'abord un ticket pour en discuter. **Aucune donnée personnelle** dans le ticket.
  - type: textarea
    id: besoin
    attributes:
      label: Le besoin
      description: Pour qui, dans quelle situation ?
    validations:
      required: true
  - type: textarea
    id: proposition
    attributes:
      label: Ta proposition
