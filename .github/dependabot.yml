# Weekly updates, through the same CI as any pull request. Security fixes are opened as soon as
# they are published. Automatic merging is not enabled (docs/deploiement.md, « Mises à jour »).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    labels: [dépendances]
    groups:
      # Playwright and its axe integration in one pull request, every kind of update. The CI image
      # of the e2e job follows package.json on its own; docker-compose.yml is updated in the same
      # pull request (scripts/check-playwright-image.mjs fails until it is).
      playwright:
        patterns: ['@playwright/test', '@axe-core/playwright']
      mineures-et-correctifs:
        update-types: [minor, patch]
      outillage-dev:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    labels: [dépendances]
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dépendances]
    ignore:
      # Follows @playwright/test (npm group « playwright » above), never on its own.
      - dependency-name: 'mcr.microsoft.com/playwright'
